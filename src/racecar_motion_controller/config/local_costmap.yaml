local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      # Reference frames
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3

      # Costmap update and publication
      update_frequency: 5.0
      publish_frequency: 2.0
      always_send_full_costmap: true

      # Rolling local window
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05

      # Robot footprint
      # Example only: replace with actual dimensions relative to base_link
      footprint: "[[0.20, 0.12], [0.20, -0.12], [-0.20, -0.12], [-0.20, 0.12]]"
      footprint_padding: 0.02

      # Costmap layers
      plugins:
        - obstacle_layer
        - inflation_layer

      # Live LiDAR obstacle detection
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          marking: true
          clearing: true

          obstacle_min_range: 0.0
          obstacle_max_range: 8.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          raytrace_min_range: 0.0
          raytrace_max_range: 10.0

          inf_is_valid: true

      # Obstacle inflation
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true

        inflation_radius: 0.35
        cost_scaling_factor: 3.0
