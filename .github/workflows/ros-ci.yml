name: ROS 2 Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ROS 2 Jazzy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            ros-jazzy-xacro \
            liburdfdom-tools

      - name: Install package dependencies
        run: |
          sudo rosdep init || true
          rosdep update
          rosdep install \
            --from-paths src \
            --ignore-src \
            --rosdistro jazzy \
            -y

      - name: Build ROS workspace
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install

      - name: Validate Xacro
        shell: bash
        run: |
          set -eo pipefail

          source /opt/ros/jazzy/setup.bash
          source install/setup.bash

          set -u

          xacro \
            src/racecar_description/urdf/racecar.xacro \
            -o /tmp/racecar.urdf

          check_urdf /tmp/racecar.urdf

      - name: Run ROS tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash

          colcon test
          colcon test-result --verbose
