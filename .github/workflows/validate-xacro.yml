name: Validate Xacro

on:
  push:
  pull_request:

jobs:
  validate-xacro:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            ros-jazzy-xacro \
            liburdfdom-tools

      - name: Install package dependencies
        run: |
          sudo rosdep init || true
          rosdep update
          rosdep install \
            --from-paths . \
            --ignore-src \
            --rosdistro jazzy \
            -y

      - name: Build ROS workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install
        shell: bash

      - name: Validate Xacro
        run: |
          set -eo pipefail

          source /opt/ros/jazzy/setup.bash
          source install/setup.bash

          set -u

          echo "Generating racecar URDF..."

          xacro \
            src/racecar_description/urdf/racecar.xacro \
            -o /tmp/racecar.urdf

          echo "Validating generated URDF..."

          check_urdf /tmp/racecar.urdf

          echo "Xacro and URDF validation passed!"
