name: Lint

on:
  push:
  pull_request:

jobs:
  python:
    name: Python - Ruff
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "--version"

      - name: Check Python linting
        run: ruff check --config formatters/ruff.toml src/

      - name: Check Python formatting
        run: ruff format --check --config formatters/ruff.toml src/

  cpp-format:
    name: C++ - clang-format
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check C++ formatting
        shell: bash
        run: |
          mapfile -d '' files < <(
            find src -type f \
              \( -name '*.cpp' -o -name '*.hpp' \
                 -o -name '*.cc' -o -name '*.h' \) \
              -print0
          )

          if (( ${#files[@]} == 0 )); then
            echo "No C++ files found."
            exit 0
          fi

          clang-format-18 \
            --style="file:$GITHUB_WORKSPACE/formatters/.clang-format" \
            --dry-run --Werror "${files[@]}"

  yaml:
    name: YAML - yamllint & Prettier
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint

      - name: Check YAML
        run: |
          yamllint -d '{
            extends: default,
            ignore: "src/racecar_state_estimation/config/ekf.yaml",
            rules: {
              document-start: disable,
              line-length: disable,
              commas: disable
            }
          }' src/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Prettier
        run: npm install --global prettier@3.10.1

      - name: Check YAML formatting
        run: |
          prettier --check \
            --config formatters/.prettierrc.json \
            --ignore-path formatters/.prettierignore \
            --ignore-path .gitignore \
            "src/**/*.{yaml,yml}" \
            "!src/racecar_state_estimation/config/ekf.yaml"
