target-version = "py312"
line-length = 100

include = ["*.py", "*.pyi"]

exclude = [
    ".git",
    "build",
    "install",
    "log",
    ".venv",
    ".pytest_cache",
]

[lint]
select = [
    "E4",  # Import and whitespace errors
    "E7",  # Statement errors
    "E9",  # Syntax errors
    "F",   # Pyflakes
    "I",   # Import ordering
    "B",   # Common bug patterns
    "UP",  # Modern Python syntax
]
